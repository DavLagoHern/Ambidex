name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # la misma versión de npm que generó package-lock.json: otras tratan distinto las dependencias opcionales
      - run: npm install -g npm@11.5.1
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:native
      - run: npm run build:assets
      - run: cargo build --features tauri/custom-protocol --manifest-path src-tauri/Cargo.toml
      - run: npm run test:e2e
      - run: npm run dist
