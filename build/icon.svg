<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#2e2560"/>
      <stop offset="0.55" stop-color="#17132e"/>
      <stop offset="1" stop-color="#0b0a14"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.47" r="0.42">
      <stop offset="0" stop-color="#8b7cf6" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#8b7cf6" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#8b7cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sheen" cx="0.5" cy="0" r="0.75">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="coral" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb08f"/>
      <stop offset="1" stop-color="#e2603e"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7af3c6"/>
      <stop offset="1" stop-color="#16a074"/>
    </linearGradient>
    <linearGradient id="spark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#cbbcff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.38"/>
    </filter>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <clipPath id="squircle">
      <rect x="100" y="100" width="824" height="824" rx="186"/>
    </clipPath>
  </defs>

  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  </g>
  <g clip-path="url(#squircle)">
    <rect x="100" y="100" width="824" height="824" fill="url(#glow)"/>
    <rect x="100" y="100" width="824" height="460" fill="url(#sheen)"/>
  </g>
  <rect x="101.5" y="101.5" width="821" height="821" rx="185" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="3"/>

  <!-- halo de color de cada agente -->
  <g opacity="0.55" filter="url(#soft)">
    <path d="M440 300 C380 300 360 322 360 372 L360 455 C360 490 340 509 300 512 C340 515 360 534 360 569 L360 652 C360 702 380 724 440 724" fill="none" stroke="#e2603e" stroke-width="62" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M584 300 C644 300 664 322 664 372 L664 455 C664 490 684 509 724 512 C684 515 664 534 664 569 L664 652 C664 702 644 724 584 724" fill="none" stroke="#16a074" stroke-width="62" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- llaves: Claude a la izquierda, Codex a la derecha -->
  <path d="M440 300 C380 300 360 322 360 372 L360 455 C360 490 340 509 300 512 C340 515 360 534 360 569 L360 652 C360 702 380 724 440 724" fill="none" stroke="url(#coral)" stroke-width="58" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M584 300 C644 300 664 322 664 372 L664 455 C664 490 684 509 724 512 C684 515 664 534 664 569 L664 652 C664 702 644 724 584 724" fill="none" stroke="url(#teal)" stroke-width="58" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- la chispa: el motor que los une -->
  <path d="M512 398 C521 470 543 492 616 512 C543 532 521 554 512 626 C503 554 481 532 408 512 C481 492 503 470 512 398 Z" fill="#9d8cff" filter="url(#blur)" opacity="0.9"/>
  <path d="M512 398 C521 470 543 492 616 512 C543 532 521 554 512 626 C503 554 481 532 408 512 C481 492 503 470 512 398 Z" fill="url(#spark)"/>
</svg>
